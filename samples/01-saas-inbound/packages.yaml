    per_unit: {field: est_seats, price: 12, min: 5, label: seats}
    includes: [Unlimited workflows, 20 templates, Email support]
  growth:
    name: Growth
    description: Multi-step approvals, reporting and standard integrations for growing operations teams.
    base: 300
    per_unit: {field: est_seats, price: 28, min: 20, label: seats}
