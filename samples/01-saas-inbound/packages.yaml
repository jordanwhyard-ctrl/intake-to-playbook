      - {name: Guided onboarding, amount: 2500}
  enterprise:
    name: Enterprise
    description: Governed workflow platform with SSO/SCIM, audit trail, sandbox and a named CSM.
    base: 1500
    per_unit: {field: est_seats, price: 42, min: 100, label: seats}
    includes: [SSO + SCIM, Full audit trail, Sandbox environment, Named CSM, 99.9% SLA]
    one_time:
      - {name: Enterprise onboarding, amount: 12000}

addons:
