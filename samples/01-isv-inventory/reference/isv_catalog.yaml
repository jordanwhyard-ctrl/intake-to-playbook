# Consultant's software catalog — the reference data every inventory line is matched against.
#
#   product              canonical name (inventory lines are renamed to this)
#   aliases              how customers actually write it in workbooks, POs and interviews
#   vendor / category    used for overlap detection and reporting
#   alternatives         competitive ISVs the consultant would put in front of the customer
#   partner_alternatives the subset of alternatives the consultant resells or implements
#   resale_margin        set when the consultant can resell THIS product (share of annual cost)
#   covered_by           the capability that replaces this product inside a suite...
#   covered_by_suites    ...when the customer already owns one of these suites
#
# Margins and alternatives are illustrative assumptions for the sample. Replace them with
# your own partner agreements and positioning. Product names belong to their owners.

